predictiva:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'dwh') }}"
      pass: "{{ env_var('POSTGRES_PASSWORD', 'dwh') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'warehouse') }}"
      schema: raw
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
      connect_timeout: 10
