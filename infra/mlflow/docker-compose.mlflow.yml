# MLflow (tracking + model registry - ADR-0019) para EC2-2.
#
# Corre en la instancia grande (t3.large) junto a DataHub y Metabase, NO en
# EC2-1 (t3a.small, 2 GB) que ya esta saturada con API + warehouse + Dagster +
# monitoreo. Mismo criterio de RAM que llevo BI/gobierno a EC2-2.
#
# Plataforma autocontenida:
#   - mlflow        server (backend Postgres + artefactos en MinIO local)
#   - mlflow-db     Postgres dedicado a la metadata de MLflow (runs, registry)
#   - mlflow-minio  object store de artefactos (modelos, plots), local a EC2-2
#
# Los clientes (Dagster en EC2-1 que loggea runs, API en EC2-1 que carga el
# modelo "Production") solo necesitan alcanzar EC2-2:5000: el server proxea los
# artefactos, asi que nadie mas toca el object store ni sus credenciales.
#
# Uso en EC2-2:
#   docker compose -f infra/mlflow/docker-compose.mlflow.yml --env-file .env up -d

services:
  mlflow:
    build: .
    container_name: predictiva-mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASS:?Set MLFLOW_DB_PASS in .env}@mlflow-db:5432/${MLFLOW_DB_NAME:-mlflow}
      --artifacts-destination s3://${MLFLOW_BUCKET:-mlflow-artifacts}
      --serve-artifacts
    ports:
      - '${MLFLOW_PORT:-5000}:5000'
    environment:
      # Artefactos en el MinIO local de EC2-2: credenciales estables, a prueba
      # del vencimiento de las STS temporales de AWS Academy que usa bronze.
      MLFLOW_S3_ENDPOINT_URL: http://mlflow-minio:9000
      AWS_ACCESS_KEY_ID: '${MLFLOW_MINIO_USER:-mlflowadmin}'
      AWS_SECRET_ACCESS_KEY: '${MLFLOW_MINIO_PASS:?Set MLFLOW_MINIO_PASS in .env}'
    depends_on:
      mlflow-db:
        condition: service_healthy
      mlflow-minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import urllib.request; urllib.request.urlopen(''http://localhost:5000/health'', timeout=5).read()'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mlflow-db:
    image: postgres:16
    container_name: predictiva-mlflow-db
    environment:
      POSTGRES_DB: '${MLFLOW_DB_NAME:-mlflow}'
      POSTGRES_USER: '${MLFLOW_DB_USER:-mlflow}'
      POSTGRES_PASSWORD: '${MLFLOW_DB_PASS:?Set MLFLOW_DB_PASS in .env}'
    volumes:
      - mlflow_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow-minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: predictiva-mlflow-minio
    command: server /data --console-address :9001
    ports:
      # Consola opcional para inspeccionar artefactos. El puerto de datos (9000)
      # NO se publica: solo el server MLflow lo usa, dentro de la red del compose.
      - '${MLFLOW_MINIO_CONSOLE_PORT:-9011}:9001'
    environment:
      MINIO_ROOT_USER: '${MLFLOW_MINIO_USER:-mlflowadmin}'
      MINIO_ROOT_PASSWORD: '${MLFLOW_MINIO_PASS:?Set MLFLOW_MINIO_PASS in .env}'
    volumes:
      - mlflow_minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  mlflow-minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    container_name: predictiva-mlflow-minio-init
    depends_on:
      mlflow-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c '
      mc alias set local http://mlflow-minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MLFLOW_BUCKET}
      '
    environment:
      MINIO_ROOT_USER: '${MLFLOW_MINIO_USER:-mlflowadmin}'
      MINIO_ROOT_PASSWORD: '${MLFLOW_MINIO_PASS:?Set MLFLOW_MINIO_PASS in .env}'
      MLFLOW_BUCKET: '${MLFLOW_BUCKET:-mlflow-artifacts}'
    restart: 'no'

volumes:
  mlflow_db_data:
  mlflow_minio_data:
