name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # API key requerida en jobs `test` e `integration-test`.
  # Configurable como GitHub Secret 'API_KEY' (Settings → Secrets and variables → Actions).
  # Sin secret, los jobs fallan a propósito: la API no debe arrancar sin clave.
  API_KEY: ${{ secrets.API_KEY }}

jobs:
  test:
    name: Tests unitarios + Black análisis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Poetry
        run: pipx install poetry

      # Las deps de ML (torch CPU ~200MB) hacen caro el install: cachear el
      # cache de poetry keyed por el lock.
      - name: Cache de dependencias Poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}

      - name: Instalar dependencias
        run: poetry install

      - name: Análisis estático de código (Black)
        run: poetry run black --check .

      - name: Correr tests API
        run: poetry run pytest tests/test_predictions.py tests/test_metrics.py tests/test_wells.py --cov=api --cov-report=term-missing

  bronze-ci:
    name: CI Bronze (Dagster + S3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Poetry
        run: pipx install poetry

      # Las deps de ML (torch CPU ~200MB) hacen caro el install: cachear el
      # cache de poetry keyed por el lock.
      - name: Cache de dependencias Poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}

      - name: Instalar dependencias
        run: poetry install

      - name: Preparar manifest dbt
        run: poetry run dbt parse --project-dir dbt --profiles-dir dbt

      - name: Correr tests Bronze
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: poetry run pytest tests/pipeline --cov=pipeline --cov-report=term-missing

  ml-ci:
    name: CI ML (librería + gate champion/challenger)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Poetry
        run: pipx install poetry

      # Las deps de ML (torch CPU ~200MB) hacen caro el install: cachear el
      # cache de poetry keyed por el lock.
      - name: Cache de dependencias Poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}

      - name: Instalar dependencias
        run: poetry install

      - name: Tests de librería ML (Arps, datos, evaluacion, config)
        run: poetry run pytest tests/pipeline/test_ml_m3.py -v

      - name: Tests de gate champion/challenger (ADR-0024)
        run: poetry run pytest tests/pipeline/test_ml_assets.py -v

  dbt-ci:
    name: CI dbt Medallion
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: warehouse
          POSTGRES_USER: dwh
          POSTGRES_PASSWORD: dwh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dwh -d warehouse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: warehouse
      POSTGRES_USER: dwh
      POSTGRES_PASSWORD: dwh
      DBT_THREADS: "2"

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Poetry
        run: pipx install poetry

      # Las deps de ML (torch CPU ~200MB) hacen caro el install: cachear el
      # cache de poetry keyed por el lock.
      - name: Cache de dependencias Poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}

      - name: Instalar dependencias
        run: poetry install

      - name: Preparar datos raw minimos
        run: poetry run python scripts/seed_demo_data.py

      - name: Correr dbt build
        run: >
          poetry run dbt build --project-dir dbt --profiles-dir dbt
          --vars '{"fecha_extraccion": "2026-06-12"}'

  build-docker:
    name: Docker Build + escaneo Trivy
    runs-on: ubuntu-latest
    needs:
      - test
      - bronze-ci
      - ml-ci
      - dbt-ci

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t predictiva-api:${{ github.sha }} .

      - name: Escaneo de vulnerabilidades de la imagen
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: predictiva-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  integration-test:
    name: Tests de integración
    runs-on: ubuntu-latest
    needs: build-docker

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Levantar el stack
        run: docker compose up -d --build

      - name: Materializar capa gold (datos demo)
        # La API consulta el esquema estrella en gold. Tras un `compose up`
        # fresco esas tablas no existen hasta correr el pipeline, asi que
        # sembramos raw minimo y ejecutamos dbt build dentro del contenedor
        # (POSTGRES_HOST=postgres-dwh ya esta seteado en su environment).
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T postgres-dwh pg_isready -U dwh -d warehouse && break
            sleep 2
          done
          docker compose exec -T api python scripts/seed_demo_data.py
          docker compose exec -T api dbt build \
            --project-dir dbt --profiles-dir dbt \
            --vars '{"fecha_extraccion": "2026-06-12"}'

      - name: Correr integration test
        run: ./scripts/integration-test.sh

      - name: Logs en caso de fallo
        if: failure()
        run: docker compose logs --no-color

      - name: Bajar el stack
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Ejecutar comandos via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: api-hidraulicos-tipazos.duckdns.org
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd Ingenieria_de_Software---Groba-Salomon-Di_Cola
            git config pull.ff only
            PREV_SHA=$(git rev-parse HEAD)
            git pull origin main
            docker-compose down
            docker-compose up -d --build
            sleep 15
            # smoke.sh requiere API_KEY como env var: la cargamos desde el .env
            # del host (no commiteado). Una subshell evita contaminar el shell
            # principal con el secreto.
            if ! ( set -a; . ./.env; set +a; ./scripts/smoke.sh ); then
              echo "Smoke test falló, rollback a $PREV_SHA"
              git reset --hard "$PREV_SHA"
              docker-compose down
              docker-compose up -d --build
              sleep 15
              ( set -a; . ./.env; set +a; ./scripts/smoke.sh ) || true
              exit 1
            fi
            echo "Salud post-deploy verificada"
