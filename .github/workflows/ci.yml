name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # API key requerida en jobs `test` e `integration-test`.
  # Configurable como GitHub Secret 'API_KEY' (Settings → Secrets and variables → Actions).
  # Sin secret, los jobs fallan a propósito: la API no debe arrancar sin clave.
  API_KEY: ${{ secrets.API_KEY }}

jobs:
  test:
    name: Tests unitarios + Black análisis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Poetry
        run: pipx install poetry

      - name: Instalar dependencias
        run: poetry install

      - name: Análisis estático de código (Black)
        run: poetry run black --check .

      - name: Correr tests API
        run: poetry run pytest tests/test_forecast.py tests/test_metrics.py tests/test_wells.py --cov=api --cov-report=term-missing

  bronze-ci:
    name: CI Bronze (Dagster + S3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Poetry
        run: pipx install poetry

      - name: Instalar dependencias
        run: poetry install

      - name: Preparar manifest dbt
        run: poetry run dbt parse --project-dir dbt --profiles-dir dbt

      - name: Correr tests Bronze
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: poetry run pytest tests/pipeline --cov=pipeline --cov-report=term-missing

  dbt-ci:
    name: CI dbt Medallion
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: warehouse
          POSTGRES_USER: dwh
          POSTGRES_PASSWORD: dwh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dwh -d warehouse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: warehouse
      POSTGRES_USER: dwh
      POSTGRES_PASSWORD: dwh
      DBT_THREADS: "2"

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Poetry
        run: pipx install poetry

      - name: Instalar dependencias
        run: poetry install

      - name: Preparar datos raw minimos
        run: |
          poetry run python - <<'PY'
          import pandas as pd
          from sqlalchemy import create_engine, text

          engine = create_engine("postgresql+psycopg2://dwh:dwh@localhost:5432/warehouse")
          fecha = pd.to_datetime("2026-06-12").date()

          listado = pd.DataFrame([
              {
                  "idpozo": "10",
                  "sigla": "ABC",
                  "formprod": "Vaca Muerta",
                  "idempresa": "YPF",
                  "idareapermisoconcesion": "A1",
                  "idareayacimiento": "Y1",
                  "idcuenca": "C1",
                  "idprovincia": "P1",
                  "codigopropio": "CP1",
                  "nombrepropio": "Pozo 10",
                  "coordenadax": "-68.5",
                  "coordenaday": "-38.2",
                  "cota": "100",
                  "profundidad": "2500",
                  "pet_inicial": "1",
                  "gas_inicial": "2",
                  "agua_inicial": "3",
                  "iny_agua_inicial": "0",
                  "iny_gas_inicial": "0",
                  "iny_otros_inicial": "0",
                  "iny_co2_inicial": "0",
                  "vida_util_inicial": "20",
                  "areapermisoconcesion": "Area 1",
                  "areayacimiento": "Yacimiento 1",
                  "cuenca": "Neuquina",
                  "provincia": "Neuquen",
                  "clasificacion": "Productivo",
                  "subclasificacion": "Gas",
                  "tipo_reservorio": "No convencional",
                  "subtipo_reservorio": "Shale",
                  "comp_perf": "Completo",
                  "gasplus": "t",
                  "fecha_extraccion": fecha,
                  "source_uri": "s3://test/listado.csv",
                  "loaded_at": pd.Timestamp.utcnow(),
                  "raw_row_number": 1,
              }
          ])

          produccion = pd.DataFrame([
              {
                  "idempresa": "YPF",
                  "anio": "2026",
                  "mes": "2",
                  "idpozo": "10",
                  "prod_pet": "1",
                  "prod_gas": "2",
                  "prod_agua": "3",
                  "iny_agua": "0",
                  "iny_gas": "0",
                  "iny_co2": "0",
                  "iny_otro": "0",
                  "tef": "30",
                  "tipoextraccion": "Surgencia",
                  "tipoestado": "Activo",
                  "tipopozo": "Gasifero",
                  "fechaingreso": "2026-02-01",
                  "fecha_data": "2026-02-28",
                  "rectificado": "f",
                  "habilitado": "t",
                  "empresa": "YPF",
                  "sigla": "ABC",
                  "formprod": "Vaca Muerta",
                  "profundidad": "2500",
                  "formacion": "Vaca Muerta",
                  "idareapermisoconcesion": "A1",
                  "areapermisoconcesion": "Area 1",
                  "idareayacimiento": "Y1",
                  "areayacimiento": "Yacimiento 1",
                  "idcuenca": "C1",
                  "cuenca": "Neuquina",
                  "idprovincia": "P1",
                  "provincia": "Neuquen",
                  "proyecto": "Proyecto 1",
                  "clasificacion": "Productivo",
                  "subclasificacion": "Gas",
                  "sub_tipo_recurso": "Shale",
                  "coordenadax": "-68.5",
                  "coordenaday": "-38.2",
                  "fecha_extraccion": fecha,
                  "source_uri": "s3://test/produccion.csv",
                  "loaded_at": pd.Timestamp.utcnow(),
                  "raw_row_number": 1,
              }
          ])

          with engine.begin() as conn:
              conn.execute(text("CREATE SCHEMA IF NOT EXISTS raw"))
              conn.execute(text("CREATE SCHEMA IF NOT EXISTS audit"))

          listado.to_sql("listado_pozos", engine, schema="raw", if_exists="replace", index=False)
          produccion.to_sql(
              "produccion_no_convencional",
              engine,
              schema="raw",
              if_exists="replace",
              index=False,
          )
          PY

      - name: Correr dbt build
        run: >
          poetry run dbt build --project-dir dbt --profiles-dir dbt
          --vars '{"fecha_extraccion": "2026-06-12"}'

  build-docker:
    name: Docker Build + escaneo Trivy
    runs-on: ubuntu-latest
    needs:
      - test
      - bronze-ci
      - dbt-ci

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t predictiva-api:${{ github.sha }} .

      - name: Escaneo de vulnerabilidades de la imagen
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: predictiva-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  integration-test:
    name: Tests de integración
    runs-on: ubuntu-latest
    needs: build-docker

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Levantar el stack
        run: docker compose up -d --build

      - name: Correr integration test
        run: ./scripts/integration-test.sh

      - name: Logs en caso de fallo
        if: failure()
        run: docker compose logs --no-color

      - name: Bajar el stack
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Ejecutar comandos via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: api-hidraulicos-tipazos.duckdns.org
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd Ingenieria_de_Software---Groba-Salomon-Di_Cola
            git config pull.ff only
            PREV_SHA=$(git rev-parse HEAD)
            git pull origin main
            docker-compose down
            docker-compose up -d --build
            sleep 15
            # smoke.sh requiere API_KEY como env var: la cargamos desde el .env
            # del host (no commiteado). Una subshell evita contaminar el shell
            # principal con el secreto.
            if ! ( set -a; . ./.env; set +a; ./scripts/smoke.sh ); then
              echo "Smoke test falló, rollback a $PREV_SHA"
              git reset --hard "$PREV_SHA"
              docker-compose down
              docker-compose up -d --build
              sleep 15
              ( set -a; . ./.env; set +a; ./scripts/smoke.sh ) || true
              exit 1
            fi
            echo "Salud post-deploy verificada"
